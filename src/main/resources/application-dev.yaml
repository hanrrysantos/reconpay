spring:
  config:
    import: "optional:file:.env[.properties]"
  jpa:
    show-sql: true
    properties:
      hibernate:
        format_sql: true
  flyway:
    locations: classpath:db/migration,classpath:db/seed

jwt:
  secret: ${JWT_SECRET}
  expiration: ${JWT_EXPIRATION:86400}

logging:
  level:
    org.hibernate.SQL: DEBUG
