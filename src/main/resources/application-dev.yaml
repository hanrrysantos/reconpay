spring:
  config:
    import: "optional:file:.env[.properties]"
  jpa:
    show-sql: true
    properties:
      hibernate:
        format_sql: true
  flyway:
    locations: classpath:db/migration,classpath:db/seed
    # Existing local databases may have already recorded historical seed V900.
    out-of-order: true
  datasource:
    url: ${DB_URL:jdbc:postgresql://localhost:5433/reconpay}
    username: ${DB_USER:postgres}
    password: ${DB_PASSWORD:1234}

logging:
  level:
    org.hibernate.SQL: DEBUG
