spring:
  application:
    name: reconpay
  servlet:
    multipart:
      max-file-size: 5MB
      max-request-size: 5MB
  datasource:
    url: ${DB_URL}
    username: ${DB_USER}
    password: ${DB_PASSWORD}
    driver-class-name: org.postgresql.Driver
  jpa:
    open-in-view: false
    hibernate:
      ddl-auto: validate
    properties:
      hibernate:
        jdbc:
          batch_size: 100
          time_zone: UTC
        order_inserts: true
        order_updates: true
  flyway:
    enabled: true

jwt:
  secret: ${JWT_SECRET}
  expiration: ${JWT_EXPIRATION:86400}

logging:
  pattern:
    console: "%d{HH:mm:ss.SSS} %-5level [%X{requestId:-}] [%X{userEmail:-anonymous}] %logger{36} - %msg%n"

management:
  endpoints:
    web:
      exposure:
        # Only /actuator/health is public; everything else here still requires
        # an authenticated request through the security filter chain.
        include: health,info,prometheus,metrics
  endpoint:
    health:
      show-details: never
  metrics:
    tags:
      application: ${spring.application.name}
  tracing:
    sampling:
      probability: ${TRACING_SAMPLE_RATE:0.1}

reconpay:
  cors:
    allowed-origins:
      - http://localhost:5173
      - http://127.0.0.1:5173
      - http://localhost:3000
      - http://127.0.0.1:3000
  email:
    resend-api-key: ${RESEND_API_KEY:}
    from: ${RECONPAY_EMAIL_FROM:ReconPay <noreply@reconpay.local>}
    verification-base-url: ${RECONPAY_VERIFICATION_BASE_URL:http://localhost:8080}
    verification-token-hours: ${RECONPAY_VERIFICATION_TOKEN_HOURS:24}
  reconciliation:
    amount-tolerance: ${RECONCILIATION_AMOUNT_TOLERANCE:0.00}
    settlement-lag-days: ${RECONCILIATION_SETTLEMENT_LAG_DAYS:5}
    max-window-days: ${RECONCILIATION_MAX_WINDOW_DAYS:366}
    async: ${RECONCILIATION_ASYNC:true}
    workers: ${RECONCILIATION_WORKERS:2}
    queue-capacity: ${RECONCILIATION_QUEUE_CAPACITY:50}

springdoc:
  api-docs:
    path: /v3/api-docs
  swagger-ui:
    path: /swagger-ui.html
  default-flat-param-object: true
