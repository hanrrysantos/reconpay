# Behind nginx: Tomcat takes the client address from X-Forwarded-For, trusting only internal proxies.
server:
  forward-headers-strategy: native

spring:
  jpa:
    show-sql: false

logging:
  structured:
    format:
      console: logstash
    json:
      add:
        application: reconpay
  level:
    org.hibernate.SQL: WARN
