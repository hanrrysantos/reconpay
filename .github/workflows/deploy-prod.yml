name: Deploy production

on:
  push:
    branches: [main]
    paths:
      - 'backend/**'
      - 'docker-compose.yaml'
      - '.github/workflows/deploy-prod.yml'
  workflow_dispatch:

concurrency:
  group: deploy-production
  cancel-in-progress: false

permissions:
  contents: read

jobs:
  deploy:
    name: Lightsail (Docker Compose)
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - name: Deploy over SSH
        uses: appleboy/ssh-action@v1.2.2
        with:
          host: ${{ secrets.LIGHTSAIL_HOST }}
          username: ${{ secrets.LIGHTSAIL_USER }}
          key: ${{ secrets.LIGHTSAIL_SSH_PRIVATE_KEY }}
          command_timeout: 40m
          script: |
            set -euo pipefail
            cd ~/reconpay
            git fetch origin main
            git reset --hard origin/main
            docker compose up -d --build --wait
            docker compose ps
            for attempt in $(seq 1 36); do
              if curl -sf http://127.0.0.1:8080/actuator/health | grep -q '"status":"UP"'; then
                exit 0
              fi
              sleep 5
            done
            echo "API health did not become UP within 3 minutes"
            docker compose logs --tail 80 api-reconpay
            exit 1
