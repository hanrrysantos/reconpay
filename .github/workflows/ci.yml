name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:
  schedule:
    - cron: '17 8 * * 1'

concurrency:
  group: ci-${{ github.ref }}-${{ github.event_name == 'schedule' && 'schedule' || 'changes' }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  changes:
    name: Detect changes
    runs-on: ubuntu-latest
    timeout-minutes: 5
    outputs:
      frontend: ${{ steps.filter.outputs.frontend }}
      backend: ${{ steps.filter.outputs.backend }}
      docker: ${{ steps.filter.outputs.docker }}
      dependencies: ${{ steps.filter.outputs.dependencies }}
    steps:
      - name: Checkout
        uses: actions/checkout@v7
        with:
          fetch-depth: 0

      - name: Classify paths
        id: filter
        run: |
          set -euo pipefail

          enable_all() {
            echo "frontend=true" >> "$GITHUB_OUTPUT"
            echo "backend=true" >> "$GITHUB_OUTPUT"
            echo "docker=true" >> "$GITHUB_OUTPUT"
            echo "dependencies=true" >> "$GITHUB_OUTPUT"
          }

          event="${{ github.event_name }}"
          if [ "$event" = "workflow_dispatch" ]; then
            enable_all
            exit 0
          fi
          if [ "$event" = "schedule" ]; then
            echo "frontend=false" >> "$GITHUB_OUTPUT"
            echo "backend=false" >> "$GITHUB_OUTPUT"
            echo "docker=false" >> "$GITHUB_OUTPUT"
            echo "dependencies=true" >> "$GITHUB_OUTPUT"
            exit 0
          fi

          if [ "$event" = "pull_request" ]; then
            base="${{ github.event.pull_request.base.sha }}"
          else
            base="${{ github.event.before }}"
          fi
          if [[ ! "$base" =~ ^[0-9a-fA-F]{40}$ ]] || [ "$base" = "0000000000000000000000000000000000000000" ] || ! git cat-file -e "${base}^{commit}" 2>/dev/null; then
            enable_all
            exit 0
          fi

          files="$(git diff --name-only "$base" HEAD)"
          has() { printf '%s\n' "$files" | grep -Eq "$1"; }

          workflow=false
          if has '^\.github/workflows/ci\.yml$'; then
            workflow=true
          fi

          frontend=false
          if [ "$workflow" = true ] || has '^frontend/'; then
            frontend=true
          fi

          backend=false
          if [ "$workflow" = true ] || has '^backend/'; then
            backend=true
          fi

          docker=false
          if [ "$workflow" = true ] || has '^backend/' || has '^docker-compose\.yaml$'; then
            docker=true
          fi

          dependencies=false
          if [ "$workflow" = true ] || has '^backend/pom\.xml$'; then
            dependencies=true
          fi

          echo "frontend=$frontend" >> "$GITHUB_OUTPUT"
          echo "backend=$backend" >> "$GITHUB_OUTPUT"
          echo "docker=$docker" >> "$GITHUB_OUTPUT"
          echo "dependencies=$dependencies" >> "$GITHUB_OUTPUT"

  frontend:
    name: Frontend
    needs: changes
    if: needs.changes.outputs.frontend == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 15
    defaults:
      run:
        working-directory: frontend

    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Enable pnpm
        uses: pnpm/action-setup@v6
        with:
          package_json_file: frontend/package.json

      - name: Set up Node.js 24
        uses: actions/setup-node@v7
        with:
          node-version: '24'
          cache: pnpm
          cache-dependency-path: frontend/pnpm-lock.yaml

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Audit dependencies
        run: pnpm audit --audit-level high

      - name: Test
        run: pnpm test

      - name: Typecheck
        run: pnpm typecheck

      - name: Build
        run: pnpm build

  build-and-test:
    name: Build and Test
    needs: changes
    if: needs.changes.outputs.backend == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 25
    defaults:
      run:
        working-directory: backend

    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Set up JDK 21
        uses: actions/setup-java@v6
        with:
          java-version: '21'
          distribution: 'temurin'
          cache: maven
          cache-dependency-path: backend/pom.xml

      - name: Build, test and check coverage
        run: ./mvnw -B verify

      - name: Upload coverage report
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: jacoco-report
          path: backend/target/site/jacoco
          if-no-files-found: warn
          retention-days: 7

  dependency-scan:
    name: Dependency Vulnerability Scan
    needs: changes
    if: needs.changes.outputs.dependencies == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 25

    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Set up JDK 21
        uses: actions/setup-java@v6
        with:
          java-version: '21'
          distribution: 'temurin'
          cache: maven
          cache-dependency-path: backend/pom.xml

      - name: Copy resolved runtime jars
        working-directory: backend
        run: |
          ./mvnw -B dependency:copy-dependencies -DincludeScope=runtime -DexcludeGroupIds=org.projectlombok -DoutputDirectory=target/dependency
          test -n "$(find target/dependency -name '*.jar' -print -quit)"

      # Scans the resolved runtime classpath. The action image supplies the vulnerability database (--noupdate).
      # Immutable action revision reviewed on 2026-09-14.
      - name: Run OWASP dependency check
        uses: dependency-check/Dependency-Check_Action@1e54355a8b4c8abaa8cc7d0b70aa655a3bb15a6c
        env:
          JAVA_HOME: /opt/jdk
        with:
          project: reconpay
          path: backend/target/dependency
          format: 'HTML'
          args: '--failOnCVSS 7'

      - name: Upload dependency check report
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: dependency-check-report
          path: reports
          if-no-files-found: warn
          retention-days: 7

  docker-build:
    name: Docker Build
    needs: changes
    if: needs.changes.outputs.docker == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 20

    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v4

      - name: Build image
        uses: docker/build-push-action@v7
        with:
          context: backend
          push: false
          load: true
          provenance: false
          tags: reconpay/api:ci
          cache-from: type=gha
          cache-to: type=gha,mode=max,ignore-error=true
